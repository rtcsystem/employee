<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=https://rameshtrading.com.ph/employee/">
    <title>Redirecting... - Ramesh Trading Corporation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background: linear-gradient(-45deg, #ffffff, #f4f6f9, #eef1f5, #fafafa);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1a1d20;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            background: #ffffff;
            border: 1px solid #e1e4e8;
            border-radius: 20px;
            padding: 45px 50px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(128, 15, 33, 0.05), 0 1px 3px rgba(0,0,0,0.02);
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo { max-width: 160px; height: auto; margin-bottom: 20px; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.1)); }

        .spinner {
            width: 40px; height: 40px;
            margin: 10px auto 20px auto;
            border: 4px solid #e1e4e8;
            border-top: 4px solid #800f21;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        h1 { font-size: 1.3rem; margin-bottom: 8px; color: #1a1d20; font-weight: 600; }
        p { font-size: 0.9rem; color: #5a626a; line-height: 1.5; margin-bottom: 18px; }

        .manual-address {
            background: #f4f6f9; padding: 10px; border-radius: 8px;
            font-family: 'Courier New', Courier, monospace; font-size: 0.85rem;
            color: #800f21; border: 1px dashed #cbd5e1; user-select: all;
            display: inline-block; margin-top: 4px; font-weight: 600;
        }
        .instruction-sub { font-size: 0.78rem; color: #888888; margin-top: 14px; margin-bottom: 4px; }
    </style>
</head>
